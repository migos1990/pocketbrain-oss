  - heading "Your editor" [level=2]
  - text: No editor. Every assistant's write that isn't its own area goes to your inbox. You can name one assistant (for example the one you talk to most) to edit on your behalf.
  - combobox "editor":
    - option "steward" [selected]
    - option "planner"
    - option "gardener"
    - option "helper"
  - button "Make it my editor"
