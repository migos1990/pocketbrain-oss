- main:
  - heading "Assistants" [level=1]
  - paragraph: Pause cuts an assistant off completely (server and relay). Read-only lets it read its slice but refuses every write. Revoke access deletes its keys, so it has to be connected again. Every change is recorded in your brain's history.
