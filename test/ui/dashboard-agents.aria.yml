- main:
  - heading "Assistants" [level=1]
  - paragraph: Pause cuts an assistant off completely (server and relay). Read-only lets it read its slice but refuses every write. Revoke access deletes its keys, so it has to be connected again. Every change is recorded in your brain's history.
  - table:
    - rowgroup:
      - row "Assistant Status Trust Holds Last 24 h Last seen Access keys Memory exam":
        - cell "Assistant"
        - cell "Status"
        - cell "Trust"
        - cell "Holds"
        - cell "Last 24 h"
        - cell "Last seen"
        - cell "Access keys"
        - cell "Memory exam"
        - cell
    - rowgroup:
      - row "steward · pasted notes · settles conflicts active · trusted · 6 notes · 6 facts · 0 reads · 0 writes · last seen never · access none · memory exam no data Read-only Pause":
