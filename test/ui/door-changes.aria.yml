  - text: "### Atlas launch `projects/atlas-launch` project · area work · updated 2026-10-07 - **status** [current]: in beta (as of 2026-09-12; self-reported; gmail:000000000000d027) - **lead** [current]: [[people/robin-lefebvre]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - **due** [current]: 2026-11-03 (as of 2026-09-12; self-reported; gmail:000000000000d027) - **next_step** [current]: freeze the beta build on 15 October (as of 2026-10-07; self-reported; gmail:000000000000e1f7) - **people** [current]: - [[people/maya-chen]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - [[people/omar-haddad]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - [[people/daniel-okoro]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - [[people/sofia-marquez]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - [[people/hannah-becker]] (as of 2026-09-12; self-reported; gmail:000000000000d027) The Atlas launch is the big one this fall: ten beta customers, a public launch on 3 November. [[people/grace-liu]] collects what the beta customers say every Friday. With [[people/robin-lefebvre]], [[people/maya-chen]], [[people/omar-haddad]], [[people/daniel-okoro]], [[people/sofia-marquez]] and [[people/hannah-becker]]. Decided so far: [[decisions/2026-09-08-atlas-beta-scope]] and [[decisions/2026-10-01-weekly-team-review]].[^1] #### From its facts Atlas launch is in beta.[^pf-status] The lead of Atlas launch is [[people/robin-lefebvre|Robin Lefebvre]].[^pf-lead] Due for Atlas launch: 3 Nov.[^pf-due] Next for Atlas launch: freeze the beta build on 15 October.[^pf-next-step] A different value is waiting to be checked. The people of Atlas launch are [[people/maya-chen|Maya Chen]], [[people/omar-haddad|Omar Haddad]], [[people/daniel-okoro|Daniel Okoro]], [[people/sofia-marquez|Sofia Marquez]] and [[people/hannah-becker|Hannah Becker]].[^pf-people] [[people/daniel-okoro|Daniel Okoro]], [[people/hannah-becker|Hannah Becker]], [[people/maya-chen|Maya Chen]], [[people/omar-haddad|Omar Haddad]] and [[people/sofia-marquez|Sofia Marquez]] work at [[orgs/harbourline|Harbourline Software]].[^p-rel-orgs-harbourline] See also [[decisions/2026-09-08-atlas-beta-scope|Atlas beta scope]].[^p-see-2026-09-08-atlas-beta-scope] See also [[people/grace-liu|Grace Liu]].[^p-see-grace-liu] See also [[decisions/2026-10-01-weekly-team-review|Weekly Atlas review on Wednesdays]].[^p-see-2026-10-01-weekly-team-review] (Written by the hub from this page's facts.) [^pf-status]: Email, 2026-09-12 (gmail:000000000000d027) [^pf-lead]: Email, 2026-09-12 (gmail:000000000000d027) [^pf-due]: Email, 2026-09-12 (gmail:000000000000d027) [^pf-next-step]: Email, 2026-10-07 (gmail:000000000000e1f7) [^pf-people]: Email, 2026-09-12 (gmail:000000000000d027) [^p-rel-orgs-harbourline]: Email, 2026-09-12 (gmail:000000000000d027); Email, 2026-08-31 (gmail:000000000000d008); Email, 2026-08-16 (gmail:000000000000d00d); Email, 2026-08-10 (gmail:000000000000d005); Email, 2026-08-17 (gmail:000000000000d006); Email, 2026-09-07 (gmail:000000000000d009) [^p-see-2026-09-08-atlas-beta-scope]: Email, 2026-09-08 (gmail:000000000000d035) [^p-see-grace-liu]: Email, 2026-10-07 (gmail:000000000000e1f9, gmail:000000000000d00b, owner:2026-09-01/notes, gcal:000000000000c006@1, gmail:000000000000d027) [^p-see-2026-10-01-weekly-team-review]: Email, 2026-10-01 (gmail:000000000000d03b) [^1]: Email, 2026-09-12 (gmail:000000000000d027)"
