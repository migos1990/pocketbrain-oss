  - text: "### Atlas launch `projects/atlas-launch` project · area work · updated 2026-10-07 - **status** [current]: in beta (as of 2026-09-12; self-reported; gmail:000000000000d027) - **lead** [current]: [[people/robin-lefebvre]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - **due** [current]: 2026-11-03 (as of 2026-09-12; self-reported; gmail:000000000000d027) - **next_step** [current]: freeze the beta build on 15 October (as of 2026-10-07; self-reported; gmail:000000000000e1f7) - **people** [current]: - [[people/maya-chen]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - [[people/omar-haddad]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - [[people/daniel-okoro]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - [[people/sofia-marquez]] (as of 2026-09-12; self-reported; gmail:000000000000d027) - [[people/hannah-becker]] (as of 2026-09-12; self-reported; gmail:000000000000d027) Atlas launch is in beta.[^p-status] The lead of Atlas launch is [[people/robin-lefebvre|Robin Lefebvre]].[^p-status] Due for Atlas launch: 3 Nov.[^p-status] Next for Atlas launch: freeze the beta build on 15 October.[^p-next-step] A different value is waiting to be checked. The people of Atlas launch are [[people/maya-chen|Maya Chen]], [[people/omar-haddad|Omar Haddad]], [[people/daniel-okoro|Daniel Okoro]], [[people/sofia-marquez|Sofia Marquez]] and [[people/hannah-becker|Hannah Becker]].[^p-status] (Written by the hub from this page's facts.) #### Earlier notes The Atlas launch is the big one this fall: ten beta customers, a public launch on 3 November. [[people/grace-liu]] collects what the beta customers say every Friday. With [[people/robin-lefebvre]], [[people/maya-chen]], [[people/omar-haddad]], [[people/daniel-okoro]], [[people/sofia-marquez]] and [[people/hannah-becker]]. Decided so far: [[decisions/2026-09-08-atlas-beta-scope]] and [[decisions/2026-10-01-weekly-team-review]].[^1] [^p-status]: Email, 2026-09-12 (gmail:000000000000d027) [^p-next-step]: Email, 2026-10-07 (gmail:000000000000e1f7) [^1]: Email, 2026-09-12 (gmail:000000000000d027)"
