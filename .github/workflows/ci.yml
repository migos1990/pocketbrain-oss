name: ci
# Every push to a branch and every PR. Tags don't run this directly: release.yml calls it for a
# tag, then publishes (docs/release.md). Paid agent evals never run here.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    # Step timeouts sit below the job's, so a hang turns a step red instead of the job "cancelled".
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans every commit, not just the tip
      # Secret scan of the whole history: a second net beside the write checks and
      # scripts/check-public.sh. Pinned release, checked against its published SHA-256.
      - name: gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact .
      # Personal terms (employer, family names...) must never reach a tracked file. The list is
      # private: a repo secret PB_DENYLIST, one term per line. Without it the step says so and passes.
      - name: personal-term denylist
        env:
          PB_DENYLIST: ${{ secrets.PB_DENYLIST }}
        run: |
          if [ -z "$PB_DENYLIST" ]; then echo "::warning::PB_DENYLIST secret not set; personal-term check skipped"; exit 0; fi
          printf '%s\n' "$PB_DENYLIST" > /tmp/denylist.txt
          sh scripts/check-public.sh /tmp/denylist.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get install -y openssh-client age   # ssh-keygen for signed-commit tests, age for backups
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: "! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'"   # no merge conflict markers
      - run: bun run typecheck
      - run: bun run deadcode   # unused files, dependencies, unlisted or unresolved imports (knip.json)
      - run: bunx playwright install --with-deps chromium   # before the tests: dashboard browser tests and eval episodes
      - name: lane
        if: github.event_name == 'pull_request'
        run: bun scripts/lane.ts "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Includes the UI regression (test/ui-regression.test.ts): every dashboard and /b page against
      # its saved snapshot in test/ui/, on the fictional sample brain. Screenshots go up as an artifact.
      - run: bun test
        timeout-minutes: 15
        env:
          PB_UI_SHOT_DIR: ui-shots
      - run: PB_CELLS=1 bun test   # every read through per-agent cells
        timeout-minutes: 15
      # A skipped browser suite looks like a pass: require one screenshot per snapshot.
      - name: the UI regression ran
        run: |
          want=$(ls test/ui/*.aria.yml | wc -l); got=$(ls ui-shots/*.png 2>/dev/null | wc -l)
          echo "UI regression: $got screenshots for $want snapshots"
          [ "$got" -ge "$want" ] && [ "$want" -gt 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots/
          if-no-files-found: ignore
          retention-days: 14
      # The eval suite (owned by the eval thread): exits 1 on regressions, ignores known gaps.
      - name: evals
        timeout-minutes: 10
        run: bun evals/run.ts --ci
      - name: demo on the fake brain
        run: bun run demo
  # Full-stack regression: a real hub on the sample brain, a fake assistant through each door
  # (pasted bearer, /b browser, OAuth, local), the same golden path on each, then the free
  # switch-day check. Answers are compared with test/e2e/doors.json. docs/release.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: every door, end to end
        timeout-minutes: 10
        run: bun scripts/e2e.ts
  # The open spec's conformance suite over real HTTP, against the reference server and a pocketBrain
  # hub on a throwaway sample brain (docs/spec/memory-passport.md, scripts/conformance.ts).
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: conformance against both servers
        timeout-minutes: 5
        run: bun run conformance
  # A PR from a fork (an outside contributor) that touches the access core, a prompt, the harness
  # or CI stays red until a maintainer runs the adversarial review (.claude/skills/review-outside-pr)
  # and adds the label "reviewed". The review is a session's job; this step only makes it unskippable.
  outside-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: sensitive paths need the adversarial review
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'reviewed') }}
        run: |
          hits=$(git diff --name-only "$BASE"...HEAD | grep -E '^src/(carve|write|checks|auth|oauth|cell|view|relay|orientation|judge|model)\.ts$|^\.claude/|^\.githooks/|^\.github/|^scripts/(gate\.ts|outbound-hosts\.txt|check-public\.sh)$|^package\.json$|^bun\.lock$' || true)
          if [ -z "$hits" ]; then echo "no sensitive paths"; exit 0; fi
          echo "$hits"
          if [ "$REVIEWED" = "true" ]; then echo "label reviewed present"; exit 0; fi
          echo "::error::outside PR touches sensitive paths; run the review-outside-pr skill, then add the label 'reviewed'"; exit 1
