name: ci
# Every push to main and every PR. Tags don't run this directly: release.yml calls it for a
# tag, then publishes (docs/release.md). Paid agent evals never run here.
on:
  push:
    branches: [main]   # branches get CI through their PR; not twice (minutes, 2026-11-01)
  pull_request:
  workflow_call:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Where the jobs run (G751, ci/mac-runner-plan.md, docs/release.md "When GitHub's runners are down"):
# GitHub's runners, unless the repo variable PB_RUNNER names the Mac's runner (["self-hosted","pb-mac"]).
# Only in the private repo, never for a fork's PR, and never the jobs that publish or hold a deploy
# key (release.yml, public-sync.yml stay on GitHub's runners). Delete the variable to go back.
jobs:
  test:
    runs-on: ${{ vars.PB_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.PB_RUNNER) || 'ubuntu-latest' }}
    # Step timeouts sit below the job's, so a hang turns a step red instead of the job "cancelled".
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans every commit, not just the tip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Secret scan of the whole history: a second net beside the write checks and
      # scripts/check-public.sh. Pinned release, checked against its published SHA-256.
      # The public repo (pocketbrain-oss) has its own history, so the commit shas in .gitleaksignore
      # never match there: it scans its tree the way public-sync.yml scans each export before the push
      # (only a rule already allowed for the same test file passes, test/public-ci.test.ts).
      - name: gitleaks
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_darwin_arm64.tar.gz
            echo "cad3de5dc9a4d5447d967a70a4d49499c557f04db028274cc324f9ff983f6502  /tmp/gitleaks.tgz" | shasum -a 256 -c -
          else
            curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
            echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tgz" | sha256sum -c -
          fi
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ "$REPO_NAME" = pocketbrain-oss ]; then
            mkdir /tmp/tree && git archive HEAD | tar x -C /tmp/tree
            (cd /tmp/tree && /tmp/gitleaks dir --no-banner --redact --exit-code 0 -f json -r /tmp/leaks.json .)
            bun scripts/public-sync.ts leaks /tmp/leaks.json .gitleaksignore
          else
            /tmp/gitleaks git --no-banner --redact .
          fi
      # Personal terms (employer, family names...) must never reach a tracked file. The list is
      # private: a repo secret PB_DENYLIST, one term per line. Without it the step says so and passes.
      - name: personal-term denylist
        env:
          PB_DENYLIST: ${{ secrets.PB_DENYLIST }}
        run: |
          if [ -z "$PB_DENYLIST" ]; then echo "::warning::PB_DENYLIST secret not set; personal-term check skipped"; exit 0; fi
          # The runner's own temp folder, emptied after each job (a Mac runner keeps /tmp between jobs).
          printf '%s\n' "$PB_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          sh scripts/check-public.sh "$RUNNER_TEMP/denylist.txt"
      - run: bun install --frozen-lockfile
      # The dependency gate (docs/release.md#dependencies): bun.lock frozen everywhere, every
      # installed license on the AGPL-compatible allowlist, no high or critical advisory.
      - run: bun scripts/deps.ts lock && bun scripts/deps.ts licenses
      - name: advisories
        run: bun audit --audit-level=high
      # Code scan on every push and PR (owner, 2026-10-31: "run security scan on pr"): Semgrep's
      # TypeScript, JavaScript and secrets rules at ERROR severity, reporting only what this change adds
      # over its base (same base as the gate's rules below), so an old finding never blocks an
      # unrelated branch. Pinned release; rules come from the Semgrep registry; metrics off.
      - name: code scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"
          elif [ "$REF" = refs/heads/main ]; then base="$BEFORE"
          else base=origin/main; fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then echo "no base to compare with"; exit 0; fi
          base=$(git rev-parse "$base")
          pipx install --quiet semgrep==1.183.0   # pipx: the runner's system Python refuses pip installs
          semgrep scan --config p/typescript --config p/javascript --config p/secrets --severity ERROR \
            --metrics off --baseline-commit "$base" --error src scripts conformance
      - run: sudo apt-get install -y openssh-client age   # ssh-keygen for signed-commit tests, age for backups
        if: runner.os == 'Linux'
      # The Mac's runner user installed age, ffmpeg and pipx once (ci/mac-runner-plan.md); ssh-keygen is built in.
      - run: command -v ssh-keygen && command -v age && command -v pipx
        if: runner.os == 'macOS'
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: "! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'"   # no merge conflict markers
      # The merge gate's rules (scripts/gate.ts), the same for every branch: test first, docs, recurring
      # jobs. The slice-audit and agent-eval evidence lives in the builder's ledger, outside the repo,
      # so here those print as notes (--no-ledger); the builder's own gate run still blocks on them.
      - name: gate rules
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"
          elif [ "$REF" = refs/heads/main ]; then base="$BEFORE"
          else base=origin/main; fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then echo "no base to compare with"; exit 0; fi
          bun scripts/gate.ts "$base" --no-run --no-ledger | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - run: bun run typecheck
      - run: bun run deadcode   # unused files, dependencies, unlisted or unresolved imports (knip.json)
      - run: bunx playwright install --with-deps chromium   # before the tests: dashboard browser tests and eval episodes
      - name: lane
        if: github.event_name == 'pull_request'
        run: bun scripts/lane.ts "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Includes the UI regression (test/ui-regression.test.ts): every dashboard and /b page against
      # its saved snapshot in test/ui/, on the fictional sample brain. Screenshots go up as an artifact.
      - run: bun test
        timeout-minutes: 15
        env:
          PB_UI_SHOT_DIR: ui-shots
      - run: PB_CELLS=1 bun test   # every read through per-agent cells
        timeout-minutes: 15
      # A skipped browser suite looks like a pass: require one screenshot per snapshot.
      - name: the UI regression ran
        run: |
          want=$(ls test/ui/*.aria.yml | wc -l); got=$(ls ui-shots/*.png 2>/dev/null | wc -l)
          echo "UI regression: $got screenshots for $want snapshots"
          [ "$got" -ge "$want" ] && [ "$want" -gt 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots/
          if-no-files-found: ignore
          retention-days: 14
      # The eval suite (owned by the eval thread): exits 1 on regressions, ignores known gaps.
      - name: evals
        timeout-minutes: 10
        run: bun evals/run.ts --ci
      # The north star on the sample brain (scripts/north-star.ts): a replayed week with 3 planted
      # contradictions must ask exactly those 3, and touched pages must reach cited prose and a link.
      - name: north star
        timeout-minutes: 5
        run: bun scripts/north-star.ts | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - name: demo on the fake brain
        run: bun run demo
      # Backup and restore end to end on the sample brain with a throwaway age key (docs/backup.md).
      - name: restore drill on the sample brain
        timeout-minutes: 5
        run: bun src/cli.ts drill --demo
  # Full-stack regression: a real hub on the sample brain, a fake assistant through each door
  # (pasted bearer, /b browser, OAuth, local), the same golden path on each, then the free
  # switch-day check. Answers are compared with test/e2e/doors.json. docs/release.md.
  e2e:
    runs-on: ${{ vars.PB_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.PB_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: every door, end to end
        timeout-minutes: 10
        run: bun scripts/e2e.ts
  # The open spec's conformance suite over real HTTP, against the reference server and a pocketBrain
  # hub on a throwaway sample brain (docs/spec/memory-passport.md, scripts/conformance.ts).
  conformance:
    runs-on: ${{ vars.PB_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.PB_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: conformance against both servers
        timeout-minutes: 5
        run: bun run conformance
  # A PR from a fork (an outside contributor) that touches the access core, a prompt, the harness
  # or CI stays red until a maintainer runs the adversarial review (.claude/skills/review-outside-pr)
  # and adds the label "reviewed". The review is a session's job; this step only makes it unskippable.
  outside-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: sensitive paths need the adversarial review
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'reviewed') }}
        run: |
          hits=$(git diff --name-only "$BASE"...HEAD | grep -E '^src/(carve|write|checks|auth|oauth|cell|view|relay|orientation|judge|model)\.ts$|^\.claude/|^\.githooks/|^\.github/|^scripts/(gate\.ts|outbound-hosts\.txt|check-public\.sh)$|^package\.json$|^bun\.lock$' || true)
          if [ -z "$hits" ]; then echo "no sensitive paths"; exit 0; fi
          echo "$hits"
          if [ "$REVIEWED" = "true" ]; then echo "label reviewed present"; exit 0; fi
          echo "::error::outside PR touches sensitive paths; run the review-outside-pr skill, then add the label 'reviewed'"; exit 1
