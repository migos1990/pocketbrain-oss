# Capture precision set (backlog #198, big bet 2: a brain that fills itself). 40 synthetic source
# items in the shapes the pulls bring in (gmail, gcal, discord, granola), about the synthetic eval
# brain (evals/fixtures/synthetic). Every item is invented; no real mail, texts or notes.
#
# want:  the facts the item states, hand-labelled. Recall counts these.
#   who   regex on the entity name the model gives (case-insensitive)
#   match regex on the value (case-insensitive); defaults to the value itself
#   quote the exact words the fact comes from; the fake model answers with it
#   attribute  may list the places the fact can rightly go, "schedule_changes|outcome"; the fake
#              model answers with the first
# also:  facts that are true but optional; listing them is not a precision miss.
# traps: wrong answers the fake model adds, the shapes real models get wrong.
#   catch: true   the code checks must drop it (quote not in the text, value or date not in the
#                 text, an attribute the brain doesn't have)
#   catch: false  a wrong fact the checks can't see (a real precision miss); grounded: false marks
#                 a right value cited from the wrong line
# Scored by evals/cases/fill.ts (`bun evals/run.ts --only fill`; `--llm` for a real model).

items:
  # ---------------------------------------------------------------- gmail ----------
  - id: fill-mail-01
    kind: gmail
    text: |
      Subject: Welcome to the department
      From: Jane Roy
      Hi all, please welcome Rita Lemieux, who joins us as associate professor this term. Her office is in Hall C. Cheers, Jane
    want:
      - { who: "rita", type: person, attribute: role, value: associate professor, quote: "who joins us as associate professor this term" }
    traps:
      - { entity: Rita Lemieux, type: person, attribute: office, value: Hall C, quote: "Her office is in Hall C", catch: true }
      - { entity: Jane Roy, type: person, attribute: role, value: associate professor, quote: "who joins us as associate professor this term", catch: false }
      # Filler a real model proposed (fill-model on 5bffc5c): the message described, not a fact in it.
      - { entity: Jane Roy, type: person, attribute: relationship, value: sender of the email, quote: "From: Jane Roy", catch: true }
      - { entity: Jane Roy, type: person, attribute: org, value: department (the sender's department), quote: "Welcome to the department", catch: true }

