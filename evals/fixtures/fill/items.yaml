    kind: gmail
    text: |
      Subject: TECH 101 midterm
      Robin, the TECH 101 fall 2026 midterm grades are due on October 21. Sam will help with the second half. Best, Jane
    want:
      - { who: "tech 101|course a", type: project, attribute: next_step, value: grade the midterm by October 21, match: "midterm.*(oct(ober)? 21|10-21)|(oct(ober)? 21|10-21).*midterm", quote: "the TECH 101 fall 2026 midterm grades are due on October 21" }
    also:
      - { who: "tech 101|course a", attribute: due, match: "2026-10-21|oct(ober)? 21" }
      - { who: "tech 101|course a", attribute: next_step, match: "sam.*(help|second half)" }
    traps:
      - { entity: TECH 101 fall 2026, type: project, attribute: due, value: 2026-10-12, quote: "midterm grades are due on October 21", catch: true }

