    traps:
      - { entity: joint account, type: money, attribute: balance, value: "$4,120.55", quote: "Balance on the joint account: $4,210.55", catch: true }
      # A value that only restates the entity's own name (fill-model on 5bffc5c).
      - { entity: Maple Trust Bank, type: org, attribute: kind, value: bank, quote: "Maple Trust Bank: your October statement is ready", catch: true }

